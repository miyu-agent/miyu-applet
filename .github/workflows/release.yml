# 打安装包（施工 DT-6，图纸 app.md「装在哪」）：照 pins.toml 取核心、网页软件编 release，搭好内容，Tauri 的打包工具打包
# （施工 AP-2 起程序不再是 Tauri 的，打包工具照旧用它的）；打完拆开三个平台的包核对装好的样子（施工 AP-5）。
# step/ 分支、手动触发只打包、传到这次运行的附件里（出包手测）；打 v 开头的 tag 才建发版（预发布，没签名），附件带 SHA256SUMS。
# 两种包：完整的（pack：带核心和网页，装上就能用，设计 59）、只装托盘的（solo：给系统源，设计 60，施工 AP-11）。
# 第五批审计 D5-3：编、打包的任务只拿读权限，checkout 不把令牌留在磁盘上（核心、网页、tauri-cli 几百个依赖的构建脚本都在
# 这个任务里跑）；只有最后传发版的小任务拿写权限，它不检出、不编东西。外部 action 按提交号钉，后面注明是哪个标签。
name: 打包

on:
  push:
    branches: ["step/**"]
    tags: ["v*"]
    # 只改文档的不重新打包（tag 照打）。
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:
    inputs:
      version:
        description: 试打用的版本号（例如 2026.11.0-rc.1）：只在这次运行里改，不提交；不写照 Cargo.toml
        required: false
        default: ""

permissions:
  contents: read

jobs:
  pack:
    permissions:
      contents: read
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            config: packaging/linux.json
          - os: macos-latest
            config: packaging/macos.json
          - os: windows-latest
            config: packaging/windows.json
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 施工 AP-12：版本号换成各种安装包认的写法（packaging/version.py 开头）；手动触发带了版本号的照它试打。
      - name: 版本号
        shell: bash
        env:
          WANT: ${{ inputs.version }}
        run: |
          py=python3; "$py" --version > /dev/null 2>&1 || py=python
          "$py" packaging/version.py --check
          if [ -n "$WANT" ]; then "$py" packaging/version.py --set "$WANT"
          # 推标签：正式标签要和 Cargo.toml 一样，演练标签 v<年.月.序号>-rc.N 照它改版本、不提交（施工 AP-13，照核心 RL-2补2）
          elif [ "$GITHUB_REF_TYPE" = tag ]; then "$py" packaging/version.py --tag "$GITHUB_REF_NAME"; fi
      - name: 读钉的版本
        id: pins
        shell: bash
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import tomllib
          pins = tomllib.load(open('pins.toml', 'rb'))
          for part in ('core', 'web'):
              print(f"{part}-repo={pins[part]['repo']}")
              print(f"{part}-rev={pins[part]['rev']}")
          EOF
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ steps.pins.outputs.core-repo }}
          ref: ${{ steps.pins.outputs.core-rev }}
          path: _core
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ steps.pins.outputs.web-repo }}
          ref: ${{ steps.pins.outputs.web-rev }}
          path: _web
      - name: 装托盘要的系统库
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev rpm
      - name: 装三个仓库各自钉住的工具链
        shell: bash
        run: |
          rustup toolchain install
          (cd _core && rustup toolchain install)
          (cd _web && rustup toolchain install)
      - name: 取编译缓存
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' }}
          add-rust-environment-hash-key: false
          key: pack
          workspaces: |
            .
            _core
            _web
      - name: 编核心
        working-directory: _core
        run: cargo build --release --locked -p miyu -p miyu-sandbox -p miyu-extract
      - name: 编网页软件
        working-directory: _web
        run: cargo build --release --locked -p miyu-web
      - name: 搭安装包的内容
        shell: bash
        run: |
          python3 packaging/stage.py --core _core --web _web --triple "$(rustc -vV | sed -n 's/^host: //p')" --out dist
      - name: 包里的核心照常起得来
        shell: bash
        run: |
          for p in dist/binaries/miyu-*; do case "$p" in *miyu-sandbox*|*miyu-extract*) ;; *) "$p" --version ;; esac; done
          cat dist/pins.txt
      - name: 装 Tauri 的打包工具
        run: cargo install tauri-cli --version =2.12.4 --locked
      # 程序不再是 Tauri 的（施工 AP-2）：`cargo tauri build` 编的时候总要带 `tauri/custom-protocol` 这个特性，没有 tauri 依赖就编不过。
      # 自己编 release，再只用它的打包（`tauri bundle` 照 mainBinaryName 找编好的 target/release/miyu-applet）。
      - name: 编托盘程序
        run: cargo build --release --locked
      - name: 打包
        shell: bash
        run: |
          py=python3; "$py" --version > /dev/null 2>&1 || py=python
          "$py" packaging/version.py --overlay "$(echo "$RUNNER_OS" | tr A-Z a-z)" --out "$RUNNER_TEMP/version.json"
          cargo tauri bundle --ci --config ${{ matrix.config }} --config "$RUNNER_TEMP/version.json"
      - name: 收安装包
        shell: bash
        run: |
          mkdir -p out
          find target/release/bundle \( -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' -o -name '*.msi' \) -exec cp {} out/ \;
          ls -la out
          test -n "$(ls out)"
      # 施工 AP-5：Tauri 的打包工具总给 deb、rpm 加 WebKitGTK 的依赖（关不掉），托盘不用网页视图，打完去掉；只改依赖，文件一个字节不动。
      - name: deb、rpm 去掉 WebKitGTK 的依赖
        if: runner.os == 'Linux'
        run: python3 packaging/drop-webkit.py out/*.deb out/*.rpm
      - name: deb 的版本写成 ~ 的（预发布）
        if: runner.os == 'Linux'
        run: python3 packaging/version.py --fix-deb out/*.deb
      # 施工 AP-5：拆开装好的样子核对，不只看打没打出来。列表先存成文件再找：管道里 grep -q 找到就退，前面的会挨 SIGPIPE。
      - name: 拆开核对（Linux：依赖没有 WebKitGTK、三份许可证）
        if: runner.os == 'Linux'
        shell: bash
        run: |
          deb=$(ls out/*.deb); rpm=$(ls out/*.rpm)
          dpkg-deb -f "$deb" Depends | tr ',' '\n' | sed 's/^ *//' > deb-depends.txt
          rpm -qpR "$rpm" | sed 's/ *$//' > rpm-requires.txt
          echo "deb Depends:"; cat deb-depends.txt; echo "rpm Requires:"; cat rpm-requires.txt
          # 版本照 packaging/version.py 换的
          got=$(dpkg-deb -f "$deb" Version); want=$(python3 packaging/version.py --expect deb)
          test "$got" = "$want" || { echo "deb 的版本是 $got，该是 $want"; exit 1; }
          got=$(rpm -qp --qf '%{VERSION}-%{RELEASE}' "$rpm"); want=$(python3 packaging/version.py --expect rpm)
          test "$got" = "$want" || { echo "rpm 的版本是 $got，该是 $want"; exit 1; }
          echo "deb $(dpkg-deb -f "$deb" Version)，rpm $got"
          if grep -i webkit deb-depends.txt rpm-requires.txt; then echo "还要 WebKitGTK"; exit 1; fi
          for want in libgtk-3-0 bubblewrap; do grep -qx "$want" deb-depends.txt || { echo "deb 少了 $want"; exit 1; }; done
          for want in gtk3 bubblewrap; do grep -qx "$want" rpm-requires.txt || { echo "rpm 少了 $want"; exit 1; }; done
          # 改过的 rpm 头的摘要对得上（没签名，只查摘要）
          rpm -K --nosignature "$rpm"
          # deb 里的路径写成 usr/…（Tauri 的打包工具不带 ./），也可能带 ./：都换成 /usr/…
          dpkg-deb -c "$deb" | awk '{print $NF}' | sed 's|^\./||; s|^|/|' > deb-files.txt
          rpm -qpl "$rpm" > rpm-files.txt
          for f in licenses/README.txt licenses/miyu-applet/LICENSE licenses/miyu-applet/THIRD-PARTY-LICENSES.txt \
                   licenses/miyu/LICENSE licenses/miyu/THIRD-PARTY-LICENSES.txt licenses/miyu/LICENSES/Apache-2.0.txt \
                   licenses/miyu-web/LICENSE licenses/miyu-web/THIRD-PARTY-LICENSES.txt \
                   packages/webui/LICENSE packages/webui/THIRD-PARTY-LICENSES.txt; do
            grep -qx "/usr/share/miyu/$f" deb-files.txt || { echo "deb 里没有 $f"; exit 1; }
            grep -qx "/usr/share/miyu/$f" rpm-files.txt || { echo "rpm 里没有 $f"; exit 1; }
          done
          echo "deb、rpm 核对过了"
      - name: 拆开核对（macOS：不占程序坞、三份许可证）
        if: runner.os == 'macOS'
        shell: bash
        run: |
          check() { # Miyu.app 的位置
            plist="$1/Contents/Info.plist"
            plutil -lint "$plist"
            test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$plist")" = true || { echo "$plist 里 LSUIElement 不是 true"; exit 1; }
            for part in miyu-applet miyu miyu-web; do
              test -s "$1/Contents/Resources/miyu/licenses/$part/THIRD-PARTY-LICENSES.txt" || { echo "$1 里没有 $part 的清单"; exit 1; }
            done
            echo "$1：LSUIElement = true，三份许可证都在"
          }
          check target/release/bundle/macos/Miyu.app
          dmg=$(ls out/*.dmg)
          mnt=$(mktemp -d)
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt"
          check "$mnt/Miyu.app"
          hdiutil detach "$mnt"
      - name: 拆开核对（Windows：PowerShell 7、三份许可证、程序的图标和名字）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $want = python -c "import tomllib; print(tomllib.load(open('pins.toml', 'rb'))['pwsh']['version'])"
          $wantVersion = python packaging/version.py --expect msi
          foreach ($msi in Get-ChildItem out -Filter *.msi) {
            # MSI 自己的版本（packaging/version.py 换的）
            $installer = New-Object -ComObject WindowsInstaller.Installer
            $db = $installer.GetType().InvokeMember('OpenDatabase', 'InvokeMethod', $null, $installer, @($msi.FullName, 0))
            $view = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db, @("SELECT Value FROM Property WHERE Property = 'ProductVersion'"))
            $view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null) | Out-Null
            $record = $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)
            $gotVersion = $record.GetType().InvokeMember('StringData', 'GetProperty', $null, $record, 1)
            $view.GetType().InvokeMember('Close', 'InvokeMethod', $null, $view, $null) | Out-Null
            # 放掉数据库，后面的 msiexec /a 才打得开
            foreach ($o in @($record, $view, $db, $installer)) { [System.Runtime.InteropServices.Marshal]::ReleaseComObject($o) | Out-Null }
            [GC]::Collect(); [GC]::WaitForPendingFinalizers()
            if ($gotVersion -ne $wantVersion) { throw "$($msi.Name)：MSI 的版本是 $gotVersion，该是 $wantVersion" }
            Write-Output "$($msi.Name)：MSI 版本 $gotVersion"
            # 管理员安装只把文件解出来，不跑自定义步骤、不写注册表
            $x = Join-Path $env:RUNNER_TEMP $msi.BaseName
            $run = Start-Process msiexec.exe -ArgumentList @('/a', "`"$($msi.FullName)`"", '/qn', "TARGETDIR=`"$x`"") -Wait -PassThru
            if ($run.ExitCode -ne 0) { throw "$($msi.Name)：msiexec /a 退出码 $($run.ExitCode)" }
            $exe = Get-ChildItem $x -Recurse -Filter miyu-applet.exe | Select-Object -First 1
            if (-not $exe) { throw "$($msi.Name) 里没有 miyu-applet.exe" }
            $root = $exe.DirectoryName
            $got = & (Join-Path $root 'resources\pwsh\pwsh.exe') -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()'
            if ($got -ne $want) { throw "$($msi.Name)：带的 PowerShell 是 $got，pins.toml 是 $want" }
            $files = @('resources\pwsh\LICENSE.txt', 'resources\pwsh\ThirdPartyNotices.txt', 'resources\licenses\README.txt') +
              (@('miyu-applet', 'miyu', 'miyu-web') | ForEach-Object { "resources\licenses\$_\LICENSE", "resources\licenses\$_\THIRD-PARTY-LICENSES.txt" })
            foreach ($f in $files) { if (-not (Test-Path (Join-Path $root $f))) { throw "$($msi.Name) 里没有 $f" } }
            if (-not (Select-String -Quiet -Path (Join-Path $root 'resources\licenses\README.txt') -Pattern 'PowerShell')) { throw "licenses\README.txt 没提 PowerShell" }
            # 程序自己的版本信息（build.rs 和图标编在同一份资源里）：任务管理器照 FileDescription 写名字
            $info = $exe.VersionInfo
            if ($info.FileDescription -ne 'Miyu' -or $info.ProductName -ne 'Miyu') { throw "miyu-applet.exe 的名字是「$($info.FileDescription)」「$($info.ProductName)」" }
            Write-Output "$($msi.Name)：PowerShell $got，许可证都在，miyu-applet.exe 是 $($info.FileDescription) $($info.FileVersion)"
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: miyu-applet-${{ runner.os }}
          path: out/*
          if-no-files-found: error
          retention-days: 14
      - name: 留下钉的版本给发版说明
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pins
          path: dist/pins.txt
          if-no-files-found: error
          retention-days: 14

  # 只装托盘的包（施工 AP-11，核心设计 60：AUR 的 miyu-applet、Homebrew 的 cask 用，依赖系统装的 miyu-core、miyu-webui）：不编核心、
  # 网页，托盘照 PATH 找 miyu（macOS 另看 Homebrew 的前缀，src/program.rs）。Linux 两种架构的 tar.gz（packaging/solo.py），macOS 的
  # .app 照 packaging/macos-solo.json 打（不带 externalBin、核心的资源），ditto 压成 zip。
  solo:
    permissions:
      contents: read
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-aarch64
          - os: macos-latest
            target: macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 版本号
        shell: bash
        env:
          WANT: ${{ inputs.version }}
        run: |
          py=python3; "$py" --version > /dev/null 2>&1 || py=python
          "$py" packaging/version.py --check
          if [ -n "$WANT" ]; then "$py" packaging/version.py --set "$WANT"
          # 推标签：正式标签要和 Cargo.toml 一样，演练标签 v<年.月.序号>-rc.N 照它改版本、不提交（施工 AP-13，照核心 RL-2补2）
          elif [ "$GITHUB_REF_TYPE" = tag ]; then "$py" packaging/version.py --tag "$GITHUB_REF_NAME"; fi
      - name: 装托盘要的系统库
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev
      - name: 装钉住的工具链
        run: rustup toolchain install
      - name: 取编译缓存
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' }}
          add-rust-environment-hash-key: false
          key: solo-${{ matrix.target }}
      - name: 编托盘程序
        run: cargo build --release --locked
      - name: 打 tar.gz（Linux）
        if: runner.os == 'Linux'
        run: python3 packaging/solo.py --binary target/release/miyu-applet --target ${{ matrix.target }} --out out
      - name: 拆开核对（Linux：只有托盘自己的几样，程序能跑）
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tgz=$(ls out/*.tar.gz)
          tar tzf "$tgz" | sed 's|^[^/]*/||' | grep -v '/$' | grep -v '^$' | sort > files.txt
          cat files.txt
          printf '%s\n' bin/miyu-applet share/applications/miyu-applet.desktop \
            share/icons/hicolor/128x128/apps/miyu-applet.png share/icons/hicolor/256x256/apps/miyu-applet.png \
            share/icons/hicolor/32x32/apps/miyu-applet.png share/licenses/miyu-applet/LICENSE \
            share/licenses/miyu-applet/THIRD-PARTY-LICENSES.txt | sort > want.txt
          diff want.txt files.txt
          mkdir x && tar xzf "$tgz" -C x
          file x/*/bin/miyu-applet
          echo "只有托盘自己的几样"
      - name: 打 .app 压 zip（macOS）
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python3 packaging/solo.py --licenses dist-solo/licenses
          cargo install tauri-cli --version =2.12.4 --locked
          cargo tauri bundle --ci --config packaging/macos-solo.json
          app=target/release/bundle/macos/Miyu.app
          plutil -lint "$app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$app/Contents/Info.plist")" = true
          ls "$app/Contents/MacOS"
          test "$(ls "$app/Contents/MacOS")" = miyu-applet || { echo "MacOS 里不只托盘"; exit 1; }
          test ! -e "$app/Contents/Resources/miyu" || { echo "带了核心的资源"; exit 1; }
          test -s "$app/Contents/Resources/licenses/THIRD-PARTY-LICENSES.txt"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          mkdir -p out
          ditto -c -k --keepParent "$app" "out/miyu-applet-$version-macos-aarch64.zip"
          ls -la out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: miyu-applet-solo-${{ matrix.target }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

  # 只有这一步拿写权限：下几个平台的附件，建发版、传上去，再出一份 SHA256SUMS。不检出仓库、不跑别人的代码。
  release:
    needs: [pack, solo]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: miyu-applet-*
          merge-multiple: true
          path: out
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pins
          path: pins
      - name: 传进发版
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la out
          tag="${GITHUB_REF#refs/tags/}"
          notes="$(printf '没签名的测试版。\n\n%s\n' "$(cat pins/pins.txt)")"
          # 预发布、不设成最新的（施工 AP-13：演练的托盘发布不顶掉以后的正式版）
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --prerelease --latest=false --title "Miyu $tag" --notes "$notes" || true
          (cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          gh release upload "$tag" out/* --clobber
