# 安装包里的核心、网页软件用哪一版（施工 DT-6）。升级：改 rev、推 step/ 分支跑三台的「打包」、出包手测，再打发版的 tag。
# 写完整的提交号。核心要 CL-7 以后的（miyu web 转交给网页包里的程序），和 Cargo.toml 里托盘连核心用的 miyu-client 钉同一个
# 提交（施工 AP-2）；网页照它的 main，不照核心 heads.toml 里钉的那一版。

[core]
repo = "miyu-agent/miyu"
rev = "c8b27e1d5e7d5f45c83dfaab289d0c55a77ce619"

[web]
repo = "miyu-agent/miyu-web"
rev = "eba24c5d67833d4ba128583112331b4dfc513a23"

# Windows 安装包带的 PowerShell 7（施工 AP-5，原来外壳的 DT-9；项目主人 2026-10-31 定：带官方 zip 版，模型在 5.1 上老写 `&&`）。
# 核心先找资源目录的 pwsh\pwsh.exe（核心 SW-5）。照当前 LTS（7.6）的最新补丁；升级：改版本和两个校验值（官方发版说明里的
# SHA256、GitHub 发版附件的 digest 两处对得上），出包手测。7.6.9 是 2026-10-25 发的，2026-11-04 核对过还是 7.6 最新的。
[pwsh]
version = "7.6.9"
win-x64 = "ce7484804c0f0ad4dda10c958e71acdaf7eebfb22505c1b480f89e0e9f1da94d"
win-arm64 = "2157fb002178e606c2a5532c56647118d90d029742f04d4900a71e3b478c2363"
